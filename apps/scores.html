<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorers | ANMSEC Mine and Dink</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>body{max-width:900px;margin:auto;padding:14px;display:grid;gap:10px}h1{font-size:30px}
.g{display:grid;grid-template-columns:54px 92px 1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.g b{font:700 20px 'Barlow Condensed';color:var(--g)}.g em{font-style:normal;font:700 20px 'Barlow Condensed'}.w{font-weight:700;color:var(--g)}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.f select{width:auto}
dialog{margin:auto;border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,94vw);color:var(--ink)}dialog::backdrop{background:#0006}
#sTab td{padding:4px;text-align:center}#sTab input{text-align:center}h2{font-size:22px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:600px){.g{grid-template-columns:44px 1fr auto}.g .tms{grid-column:1/-1;order:5}}</style></head><body>
<div class="f"><h1>Scorers</h1><span class="hint" id="who" style="margin-left:auto"></span><button class="ghost" id="out">Sign out</button></div>
<div class="f"><select id="fd"><option value="0">All days</option><option value="1">Day 1</option><option value="2">Day 2</option></select><select id="fc"></select><label class="f hint"><input type="checkbox" id="fp" style="width:auto"> Not finished only</label></div>
<div id="list"></div>
<dialog id="sdlg"><h2 id="sTitle"></h2><table id="sTab" style="width:100%;border-collapse:collapse"><tr><th></th><th id="sA"></th><th id="sB"></th></tr></table><p class="hint" id="sRes" style="margin:10px 0"></p>
<div class="row"><button id="sSave">Save</button><button class="ghost" id="sCancel">Cancel</button><button class="ghost" id="sClear" style="margin-left:auto">Clear</button></div></dialog>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script><script src="scoring.js"></script><script src="scorers.js"></script></body></html>
