<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>72nd ANMSEC Mine and Dink | TV</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281e;--mute:#5f7a6c;--line:#cfe3d9;--g:#15803d;--gd:#14532d;--gl:#dcfce7;--gold:#b98a14}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;cursor:none;margin:0}
body{font:500 2.4vh/1.25 'Barlow',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% -10%,#dcfce7,#f2faf4 60%)}
h1,h2{font-family:'Barlow Condensed',sans-serif;margin:0;line-height:1;text-transform:uppercase}
/* header bar: logo + event name; each view's title sits on the right of it */
#hd{position:fixed;top:0;left:0;right:0;height:9.5vh;background:var(--gd);color:#fff;display:flex;align-items:center;gap:1.2vw;padding:0 2vw;border-bottom:.5vh solid var(--g)}
#hd img{height:7vh;width:auto;max-width:12vh;object-fit:contain}
#hd .en{font:700 4.6vh/1 'Barlow Condensed';letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .en sup{font-size:.55em;line-height:0;vertical-align:super;text-transform:lowercase}
.v{position:fixed;inset:0;display:none;flex-direction:column;padding:1.6vh 2vw;gap:1.4vh}.v.on{display:flex}
#pools,#schedule,#standings,#bracket{top:9.5vh;padding-top:1.8vh}
.v h1.t{position:absolute;top:-9.5vh;right:2vw;height:9.5vh;display:flex;align-items:center;font-size:5.4vh;color:#fcd34d;letter-spacing:.06em;text-align:right}
.g4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.g2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:1.4vh 1.4vw}
.pool{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9vh .8vw;overflow:hidden;min-height:0}
.pool h2{font-size:3.2vh;color:#fff;background:var(--g);border-radius:8px;padding:.5vh 1vw}
.tm{display:flex;align-items:center;gap:.6vw;margin-top:.5vh;font:600 2.3vh 'Barlow';min-width:0}
.tm img{height:4.2vh;width:4.2vh;object-fit:contain;flex:none}.tm span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gm{display:grid;grid-template-columns:auto 1fr auto;gap:.6vw;align-items:center;margin-top:.4vh;border:1px solid var(--line);border-radius:10px;padding:.2vh .6vw;font:700 2.4vh/1.05 'Barlow Condensed';text-transform:uppercase}
.gm b{color:var(--gold)}.gm .w{color:var(--g)}.gm .s{text-align:center;color:var(--gd)}
/* standings: sized so a pool of 6 teams fits */
.st{width:100%;border-collapse:collapse;margin-top:.5vh;font:600 2.1vh/1.1 'Barlow'}.st th{color:var(--mute);font-size:1.7vh}
.st td,.st th{text-align:center;padding:.5vh .3vw;border-top:1px solid var(--line)}.st td.n{text-align:left}.st tr.q td{background:var(--gl)}
.st .tm{margin-top:0;gap:.5vw;font:inherit}.st .tm img{height:3.4vh;width:3.4vh}
.br{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;align-items:center}
.m{background:#fff;border:2px solid var(--line);border-radius:12px;padding:1vh 1vw;margin:1.4vh 0}.m .r{display:flex;justify-content:space-between;font:700 3vh 'Barlow Condensed';text-transform:uppercase;padding:.3vh 0}
.m .w{color:var(--g)}.br h2{text-align:center;font-size:3.4vh;color:var(--gd)}
#title{align-items:center;justify-content:center;text-align:center;gap:1vh;background:linear-gradient(160deg,#14532d,#16a34a)}
#title img{height:30vh;max-width:60vw;object-fit:contain;margin-bottom:1vh}
#title .t0{font:700 7vh 'Barlow Condensed';color:#fcd34d;letter-spacing:.2em;text-transform:uppercase}#title .t0 sup{font-size:.55em;line-height:0;vertical-align:super;text-transform:lowercase}
#title .t1{font:700 18vh/.9 'Barlow Condensed';color:#fff;letter-spacing:.05em}#title .t2{font:700 6.4vh 'Barlow Condensed';color:#bbf7d0;letter-spacing:.2em;text-transform:uppercase}
#title .t3{font:600 3.2vh 'Barlow';color:#dcfce7;margin-top:1vh}
.pt{margin-top:1.4vh;font:600 2.6vh 'Barlow'}
</style></head><body>
<div id="hd"><img src="logo.png" alt="" onerror="this.remove()"><div class="en">72<sup>nd</sup> ANMSEC Mine and Dink Team Tournament Open 2026</div></div>
<div class="v" id="title"><img src="logo.png" alt="" onerror="this.remove()"><div class="t0">72<sup>nd</sup> ANMSEC</div><div class="t1">MINE AND DINK</div><div class="t2">Team Tournament Open 2026</div><div class="t3">November 18–19, 2026 · Court 463, Baguio City</div></div>
<div class="v" id="pools"><h1 class="t">Pools</h1><div class="g4" id="poolG"></div></div>
<div class="v" id="schedule"><h1 class="t">Game Schedule</h1><div class="g4" id="schG"></div></div>
<div class="v" id="standings"><h1 class="t">Standings</h1><div class="g2" id="stG"></div></div>
<div class="v" id="bracket"><h1 class="t">Playoffs</h1><div class="br" id="brG"></div></div>
<div class="v" id="blank" style="background:#fff"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="scoring.js"></script><script src="tv.js"></script>
</body></html>
