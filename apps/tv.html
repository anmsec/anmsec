<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANMSEC TV</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;overflow:hidden;cursor:none}
body{background:radial-gradient(120% 80% at 50% -10%,#dcfce7,#f2faf4 60%)}
.v{position:fixed;inset:0;display:none;flex-direction:column;padding:2vh 2vw;gap:1.6vh}.v.on{display:flex}
h1.t{font-size:6vh;text-align:center;color:#14532d;letter-spacing:.03em}
.g4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.g2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.pool{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1vh .8vw;overflow:hidden;min-height:0}
.pool h2{font-size:3.4vh;color:#fff;background:var(--g);border-radius:8px;padding:.4vh 1vw}
.tm{display:flex;align-items:center;gap:.7vw;margin-top:.8vh;font:600 2.5vh 'Barlow';min-width:0}
.tm img{height:5vh;width:5vh;object-fit:contain;flex:none}.tm span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gm{display:grid;grid-template-columns:auto 1fr auto;gap:.6vw;align-items:center;margin-top:.5vh;border:1px solid var(--line);border-radius:10px;padding:.3vh .6vw;font:700 2.7vh/1.05 'Barlow Condensed';text-transform:uppercase}
.gm b{color:var(--gold)}.gm .w{color:var(--g)}.gm .s{text-align:center;color:#14532d}
.st{width:100%;border-collapse:collapse;margin-top:.6vh;font:600 2.4vh 'Barlow'}.st th{color:var(--mute);font-size:1.9vh}
.st td,.st th{text-align:center;padding:.8vh .3vw;border-top:1px solid var(--line)}.st td.n{text-align:left}.st tr.q td{background:var(--gl)}
.br{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;align-items:center}
.m{background:#fff;border:2px solid var(--line);border-radius:12px;padding:1vh 1vw;margin:1.4vh 0}.m .r{display:flex;justify-content:space-between;font:700 3vh 'Barlow Condensed';text-transform:uppercase;padding:.3vh 0}
.m .w{color:var(--g)}.br h2{text-align:center;font-size:3.4vh;color:#14532d}
#title{align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#14532d,#16a34a)}
#title .t1{font:700 20vh/.9 'Barlow Condensed';color:#fff;letter-spacing:.05em}#title .t2{font:700 8vh 'Barlow Condensed';color:#bbf7d0;letter-spacing:.2em;text-transform:uppercase}
.pt{margin-top:1.4vh;font:600 2.6vh 'Barlow'}
</style></head><body>
<div class="v" id="title"><div class="t1">MINE AND DINK</div><div class="t2">ANMSEC Pickleball Team Tournament</div></div>
<div class="v" id="pools"><h1 class="t">Pools</h1><div class="g4" id="poolG"></div></div>
<div class="v" id="schedule"><h1 class="t">Game Schedule</h1><div class="g4" id="schG"></div></div>
<div class="v" id="standings"><h1 class="t">Standings</h1><div class="g2" id="stG"></div></div>
<div class="v" id="bracket"><h1 class="t">Playoffs</h1><div class="br" id="brG"></div></div>
<div class="v" id="blank" style="background:#fff"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="scoring.js"></script><script src="tv.js"></script>
</body></html>
